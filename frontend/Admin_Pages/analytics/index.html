<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NexusPay Admin — Platform Analytics</title>
    <meta name="description" content="NexusPay Admin Panel — Platform analytics, revenue trends, transaction management and user growth insights." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="../sharedadmin/globals.css" />
    <link rel="stylesheet" href="./analytics.css" />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../../shared/api-config.js"></script>
</head>

<body>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- Main Content -->
        <div class="main-area">
            <!-- Header -->
            <header id="header-bar"></header>

            <!-- Page Content -->
            <main class="main-content">

                <!-- Charts Grid -->
                <section class="charts-section">
                    <div class="charts-grid-2col">
                        <div id="chart-revenue"></div>
                        <div id="chart-volume"></div>
                    </div>

                    <div id="chart-growth"></div>

                    <div class="charts-grid-2col">
                        <div id="chart-category"></div>
                        <div id="chart-hourly"></div>
                    </div>

                    <div id="chart-top-categories"></div>
                </section>
            </main>
        </div>
    </div>

    <!-- JS Modules (order matters) -->
    <script src="../sharedadmin/js/utils/auth.js"></script>
    <script src="../sharedadmin/js/utils/helpers.js"></script>
    <script src="../sharedadmin/js/services/dataService.js"></script>
    <script src="../sharedadmin/js/components/toast.js"></script>
    <script src="../sharedadmin/js/components/sidebar.js"></script>
    <script src="../sharedadmin/js/components/roleSwitcher.js"></script>
    <script src="./charts.js"></script>
    <script src="./app.js"></script>

</body>

</html>
